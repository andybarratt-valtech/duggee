<head>
<meta charset="UTF-8">

<title>Which Duggee Episode?</title>
<style>
  :root {
    --bg: #fdf6e3;
    --card: #ffffff;
    --accent: #b5541a;
    --accent-dark: #7a3610;
    --text: #2b2b2b;
    --muted: #8a8478;
    --border: #e8ddc8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 14px 60px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; width: 100%; }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    margin: 0 0 4px;
    color: var(--accent-dark);
  }
  p.sub {
    text-align: center;
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 0.9rem;
  }
  .search-box {
    position: relative;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--card);
    -webkit-appearance: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  .results {
    margin-top: 10px;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .result-item {
    padding: 14px 16px;
    min-height: 44px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    -webkit-tap-highlight-color: rgba(181,84,26,0.15);
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background: #fbf1de; }
  .result-title { font-weight: 500; }
  .result-meta {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .picked {
    margin-top: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
  }
  .picked .big {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 6px;
  }
  .picked .details {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .empty-note {
    text-align: center;
    color: var(--muted);
    margin-top: 16px;
    font-size: 0.9rem;
  }
  .count {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 24px;
  }
</style>

<body>
<div class="wrap">
  <h1>🐶 Which Duggee Episode?</h1>
  <p class="sub">Search for an episode</p>
  <div class="search-box">
    <input type="text" id="q" placeholder="e.g. space, midnight, cheese..." autocomplete="off" autofocus>
  </div>
  <div id="results" class="results" style="display:none;"></div>
  <div id="picked" style="display:none;"></div>
  <div id="emptyNote" class="empty-note" style="display:none;">No match. Try a different word from the title, or check spelling.</div>

  <div id="shakeSection" style="text-align:center; margin-top:22px;">
    <button id="shakeBtn" type="button" style="
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    ">🎲 Pick a random episode</button>
    <p style="color: var(--muted); font-size: 0.8rem; margin-top: 8px;">
      Or just shake the phone.
    </p>
  </div>
  <div id="randomPicked" style="display:none;"></div>

  <div class="count" id="count"></div>
</div>

document.getElementById('count').textContent = episodes.length + ' episodes loaded (Series 1\u20135, up to Sep 2025). List may be missing anything released after that.';

const input = document.getElementById('q');
const resultsEl = document.getElementById('results');
const pickedEl = document.getElementById('picked');
const emptyEl = document.getElementById('emptyNote');

function normalize(s) {
  return s.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
}

function search(term) {
  const t = normalize(term);
  if (!t) return [];
  const words = t.split(/\s+/);
  return episodes
    .filter(ep => {
      const title = normalize(ep[3]);
      return words.every(w => title.includes(w));
    })
    .sort((a, b) => normalize(a[3]).indexOf(words[0]) - normalize(b[3]).indexOf(words[0]));
}

function render() {
  const term = input.value;
  pickedEl.style.display = 'none';
  if (!term.trim()) {
    resultsEl.style.display = 'none';
    emptyEl.style.display = 'none';
    return;
  }
  const matches = search(term).slice(0, 8);
  if (matches.length === 0) {
    resultsEl.style.display = 'none';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  resultsEl.style.display = 'block';
  resultsEl.innerHTML = '';
  matches.forEach(ep => {
    const div = document.createElement('div');
    div.className = 'result-item';
    const label = ep[0] === 0 ? 'Pilot' : `S${ep[0]} E${ep[1]}`;
    div.innerHTML = `<span class="result-title">${ep[3]}</span><span class="result-meta">${label}</span>`;
    div.addEventListener('click', () => pick(ep));
    resultsEl.appendChild(div);
  });
}

function pick(ep) {
  resultsEl.style.display = 'none';
  emptyEl.style.display = 'none';
  pickedEl.style.display = 'block';
  const label = ep[0] === 0
    ? 'Pilot short (2012), before Series 1'
    : `Series ${ep[0]}, Episode ${ep[1]}`;
  pickedEl.innerHTML = `
    <div class="big">${ep[3]}</div>
    <div class="details">${label} &middot; overall episode #${ep[2] || '\u2013'}</div>
  `;
}

input.addEventListener('input', render);

// ---- Random episode (button + shake) ----
const shakeBtn = document.getElementById('shakeBtn');
const randomPickedEl = document.getElementById('randomPicked');

function showRandomEpisode() {
  // exclude the pilot (index 0) from random picks, it's an outlier
  const pool = episodes.filter(ep => ep[0] !== 0);
  const ep = pool[Math.floor(Math.random() * pool.length)];

  // clear the search UI so it doesn't look like two answers are shown at once
  input.value = '';
  resultsEl.style.display = 'none';
  pickedEl.style.display = 'none';
  emptyEl.style.display = 'none';

  randomPickedEl.style.display = 'block';
  randomPickedEl.className = 'picked';
  randomPickedEl.innerHTML = `
    <div class="big">🎲 ${ep[3]}</div>
    <div class="details">Series ${ep[0]}, Episode ${ep[1]} &middot; overall episode #${ep[2]}</div>
  `;
}

shakeBtn.addEventListener('click', showRandomEpisode);

// Shake detection via devicemotion
let lastShakeTime = 0;
const SHAKE_THRESHOLD = 18; // total acceleration delta to count as a shake
let lastX = null, lastY = null, lastZ = null;

function handleMotion(event) {
  const acc = event.accelerationIncludingGravity;
  if (!acc || acc.x === null) return;
  const { x, y, z } = acc;
  if (lastX !== null) {
    const delta = Math.abs(x - lastX) + Math.abs(y - lastY) + Math.abs(z - lastZ);
    const now = Date.now();
    if (delta > SHAKE_THRESHOLD && now - lastShakeTime > 1200) {
      lastShakeTime = now;
      showRandomEpisode();
    }
  }
  lastX = x; lastY = y; lastZ = z;
}

function enableShakeListening() {
  window.addEventListener('devicemotion', handleMotion);
}

// iOS 13+ requires an explicit permission request triggered by a user gesture.
// We attach it to the same button tap, so one tap both picks a random episode
// AND (on iOS) unlocks shake detection for next time.
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
  shakeBtn.addEventListener('click', function requestMotionOnce() {
    DeviceMotionEvent.requestPermission()
      .then(state => {
        if (state === 'granted') enableShakeListening();
      })
      .catch(() => { /* permission denied or unsupported; button still works */ });
    shakeBtn.removeEventListener('click', requestMotionOnce);
  }, { once: true });
} else if (typeof DeviceMotionEvent !== 'undefined') {
  // Android / non-iOS-13+ browsers: no permission gate needed
  enableShakeListening();
}
